<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f5">
<title>Волосы</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:14px;color:#8b8b91;margin-bottom:5px}.title{font-size:32px;font-weight:750;letter-spacing:-1.2px}.streak{text-align:right}.streak b{display:block;font-size:24px}.streak span{font-size:12px;color:#888}
.card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.055);margin-bottom:14px}
.summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.summary b{font-size:17px}.summary span{color:#888;font-size:14px}
.progress{height:7px;background:#ededee;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;width:0;background:#111;border-radius:99px;transition:.3s}
.doses{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dose{border:0;border-radius:20px;background:#f1f1f3;padding:17px 12px;text-align:left;color:#111;font:inherit;cursor:pointer;transition:.16s}.dose:active{transform:scale(.97)}.dose.done{background:#111;color:#fff}.dose-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.emoji{font-size:24px}.check{width:26px;height:26px;border-radius:50%;background:#ddd;display:grid;place-items:center;font-size:14px}.done .check{background:#fff;color:#111}.dose strong{display:block;font-size:16px;margin-bottom:3px}.dose small{font-size:12px;opacity:.55}.done small{opacity:.65}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}.section-head b{font-size:18px}.section-head span{font-size:12px;color:#999}
.history{display:flex;flex-direction:column;gap:8px}.day{background:#fff;border-radius:19px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between}.dayname{font-size:14px;font-weight:650}.dayname small{display:block;color:#999;font-weight:400;margin-top:2px}.marks{display:flex;gap:6px}.mark{width:34px;height:34px;border-radius:11px;background:#eeeef0;display:grid;place-items:center;font-size:14px}.mark.done{background:#111;color:#fff}
.empty{padding:20px;text-align:center;color:#999;background:#fff;border-radius:19px;font-size:14px}
.reset{width:100%;border:0;background:transparent;color:#aaa;padding:16px;font:inherit;font-size:12px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="eyebrow" id="date"></div><div class="title">Волосы</div></div>
    <div class="streak"><b id="streak">0</b><span>дней подряд</span></div>
  </div>

  <div class="card">
    <div class="summary"><b>Сегодня</b><span id="count">0 из 2</span></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="doses">
      <button class="dose" id="morning" onclick="toggle('morning')">
        <div class="dose-top"><span class="emoji">☀️</span><span class="check">✓</span></div>
        <strong>Утро</strong><small id="morningTime">Нажать после пшиканья</small>
      </button>
      <button class="dose" id="evening" onclick="toggle('evening')">
        <div class="dose-top"><span class="emoji">🌙</span><span class="check">✓</span></div>
        <strong>Вечер</strong><small id="eveningTime">Нажать после пшиканья</small>
      </button>
    </div>
  </div>

  <div class="section-head"><b>Последние дни</b><span>30 дней</span></div>
  <div class="history" id="history"></div>
  <button class="reset" onclick="resetAll()">Сбросить историю</button>
</div>

<script>
const KEY="hair_spray_tracker_v2";
const getData=()=>JSON.parse(localStorage.getItem(KEY)||"{}");
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
const today=()=>{let d=new Date();return d.toISOString().slice(0,10)};
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"});
const time=()=>new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});

function toggle(type){
 let d=getData(),t=today();
 if(!d[t]) d[t]={morning:null,evening:null};
 d[t][type]=d[t][type]?null:time();
 save(d);render();
}
function render(){
 let d=getData(),t=today();
 if(!d[t]) d[t]={morning:null,evening:null};
 let m=!!d[t].morning,e=!!d[t].evening,n=m+e;
 document.getElementById("morning").classList.toggle("done",m);
 document.getElementById("evening").classList.toggle("done",e);
 document.getElementById("morningTime").textContent=m?d[t].morning:"Нажать после пшиканья";
 document.getElementById("eveningTime").textContent=e?d[t].evening:"Нажать после пшиканья";
 document.getElementById("count").textContent=n+" из 2";
 document.getElementById("bar").style.width=(n*50)+"%";
 document.getElementById("date").textContent=new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
 renderHistory(d);renderStreak(d);
}
function renderHistory(d){
 let dates=[];
 for(let i=0;i<30;i++){let x=new Date();x.setDate(x.getDate()-i);dates.push(x.toISOString().slice(0,10))}
 document.getElementById("history").innerHTML=dates.map(x=>{
   let a=d[x]||{},m=!!a.morning,e=!!a.evening;
   return `<div class="day"><div class="dayname">${fmt(x)}${x===today()?'<small>Сегодня</small>':''}</div><div class="marks"><div class="mark ${m?'done':''}">${m?'✓':'☀️'}</div><div class="mark ${e?'done':''}">${e?'✓':'🌙'}</div></div></div>`
 }).join("");
}
function renderStreak(d){
 let streak=0,cur=new Date();
 while(true){
   let x=cur.toISOString().slice(0,10),a=d[x];
   if(a&&a.morning&&a.evening){streak++;cur.setDate(cur.getDate()-1)}else break;
 }
 document.getElementById("streak").textContent=streak;
}
function resetAll(){if(confirm("Удалить всю историю?")){localStorage.removeItem(KEY);render()}}
render();
</script>
</body>
</html>
